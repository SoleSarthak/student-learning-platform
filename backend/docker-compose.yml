services:

  db:
    image: postgres:16
    container_name: student-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: student-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: student-platform-backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/student_learning_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-this-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

  celery:
    build: .
    container_name: student-platform-celery
    restart: unless-stopped
    depends_on:
      - db
      - redis
    command: celery -A app.worker.celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/student_learning_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-this-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

volumes:
  postgres_data: